// 3D_Hex  — multiplayer client layer
// ══════════════════════════════════════════════════════════════════════════════
// MULTIPLAYER LAYER
// All shared-game-state mutations now go through the server.
// Local display/camera variables are never sent to the server.
// ══════════════════════════════════════════════════════════════════════════════

// Will be set once Socket.IO connects
var socket = null;
var my_seat = null;          // 1 = red (2D player), 2 = green (1D player), null = spectator
var tentative_move_pending = false; // true between cursor-hover set_bond_colors and a real move
var my_move_in_flight = false;      // true after we emit a move, until state_update arrives
                                    // prevents applyServerState from clobbering our local
                                    // cylinder_colors which are already correct

// ── Seat banner helper ──────────────────────────────────────────────────────
function updateSeatBanner(msg) {
  var el = document.getElementById('seat_banner');
  if (el) el.textContent = msg;
}

// ── Refocus helper — returns keyboard focus to canvas after any alert() ────────
// alert() steals focus to the browser's dialog. After OK is clicked the focus
// stays on the dialog remnant, so keydown events (e.g. Enter) don't reach the
// game. canvas.focus() restores focus immediately; tabIndex makes it focusable.
function refocusCanvas() {
  if (canvas) {
    canvas.setAttribute('tabindex', '0');
    canvas.focus();
  }
}

// ── Turn notification helper ─────────────────────────────────────────────────
// Uses the Web Notifications API so the alert appears even when this window
// is in the background or does not have mouse focus.
// Falls back to a prominent on-screen flash banner if permission is denied.
var notifyPermissionRequested = false;
function notifyTurn(msg) {
  // Always update the status text
  nf.innerHTML = msg;

  // Show a temporary bright flash banner in the page itself (visible regardless
  // of window focus) so keyboard-only users are always informed.
  var banner = document.createElement('div');
  banner.textContent = msg;
  banner.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);' +
    'background:#ff0;color:#000;font-size:28px;font-family:monospace;font-weight:bold;' +
    'padding:20px 40px;border:4px solid #f00;border-radius:12px;z-index:99999;' +
    'text-align:center;box-shadow:0 0 30px rgba(0,0,0,0.5);';
  document.body.appendChild(banner);
  setTimeout(function() {
    if (banner.parentNode) banner.parentNode.removeChild(banner);
  }, 4000);

  // Also try a system notification (works even if window is minimised)
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') {
    new Notification('3D Hex — Your Turn', { body: msg, icon: '' });
  } else if (Notification.permission !== 'denied' && !notifyPermissionRequested) {
    notifyPermissionRequested = true;
    Notification.requestPermission().then(function(perm) {
      if (perm === 'granted')
        new Notification('3D Hex — Your Turn', { body: msg, icon: '' });
    });
  }
}

// ── Apply a full state snapshot from the server ─────────────────────────────
// Called on 'welcome' and 'state_update'.  Updates all shared variables and
// triggers a redraw.
function applyServerState(s) {
  var prev_moves = moves;
  var prev_random_sites = random_sites;
  var prev_player = player;  // track whose turn it was before this update

  actual_levels      = s.actual_levels;
  redturns           = s.redturns;
  saved_first_player = s.saved_first_player;
  player             = s.player;
  red_moves          = s.red_moves;
  red_moves_incremented = s.red_moves_incremented;
  moves              = s.moves;
  random_sites       = s.random_sites;
  winning_player     = s.winning_player;
  move_active_level  = s.move_active_level;
  move_active_k      = s.move_active_k;
  undo_calls         = s.undo_calls;

  // Board arrays — always copy sphere_colors.
  var ns = 19 * actual_levels;
  for (var ii = 0; ii < ns; ++ii)
    sphere_colors[ii] = s.sphere_colors[ii];

  // cylinder_colors: if WE just made the move, our local copy is already correct
  // (set_bond_colors ran locally for immediate feedback).  Overwriting it with the
  // server's pre-delta copy would wipe out the bond colours we just painted.
  // The other player will get the correct colours via the cylinder_delta event.
  if (!my_move_in_flight) {
    var nc = 7 * ns;
    for (var ii = 0; ii < nc; ++ii)
      cylinder_colors[ii] = s.cylinder_colors[ii];
  }
  my_move_in_flight = false;  // clear the flag now that we have the ack

  // If a new random red site was added, paint its bonds on the receiving client.
  // The server now stores the site's level/k in move_active_level/move_active_k,
  // so we can call set_bond_colors directly — no scan needed.
  if (random_sites > prev_random_sites && !my_move_in_flight) {
    set_bond_colors(s.move_active_level, s.move_active_k, 1, 0);
    nf.innerHTML = random_sites + " random red positions have been added";
  }

  // Sync active cursor and bond-site tables if a reset happened.
  // When moves===0 arrives it means a new game has started — clear winning_player
  // on ALL clients (not just the one who pressed Enter) so both screens reset.
  if (moves === 0) {
    winning_player     = 0;
    actual_nsites      = 19 * actual_levels;
    actual_n_cylinders = 7 * actual_nsites;
    end_level          = actual_levels;
    active_level       = Math.floor(actual_levels / 2);
    active_k           = 0;
    t_active_level     = active_level;
    t_active_k         = 0;
    tentative_move_pending = false;
    for (var ci = 0; ci < actual_nsites; ++ci) sphere_colors[ci] = 0;
    for (var ci = 0; ci < 7*actual_nsites; ++ci) cylinder_colors[ci] = 0;
    nf.innerHTML = (player === 1)
      ? 'New game. Remaining red turns: ' + Math.ceil(red_moves).toFixed(0)
      : 'New game. Green goes first.';
    initSites();
    make_bond_sites();
    make_win_test_bond_sites();
  }

  // Run win test on BOTH clients whenever a new move has just been recorded.
  // (In the tick loop this only ran on the moving player's client.)
  if (moves > prev_moves && winning_player === 0) {
    make_win_test_bond_sites();
    var green_won = (player === 1) && depth_first_search(0);
    var red_won   = (player === 2 || !red_moves_incremented) && !depth_first_search(1);
    if (green_won) {
      ++green_wins;
      nf.innerHTML = "Green 1D player wins. Red wins " + red_wins + ", green wins " + green_wins +
                     ". Press Enter key to start over with current settings.";
      alert('Green 1D player wins. Press Enter key to start over with current settings.');
      mouse_down = 0; dragging = false;  // alert consumed the mouseup event
      refocusCanvas();
      winning_player = 1;  // local flag so Enter key works
      if (socket) socket.emit('win', { winning_player: 1 });
    } else if (red_won) {
      ++red_wins;
      nf.innerHTML = "Red 2D player wins. Red wins " + red_wins + ", green wins " + green_wins +
                     ". Press Enter key to start over with current settings.";
      alert('Red 2D player wins. Press Enter key to start over with current settings.');
      mouse_down = 0; dragging = false;  // alert consumed the mouseup event
      refocusCanvas();
      winning_player = 2;
      if (socket) socket.emit('win', { winning_player: 2 });
    }
  }

  // Update the status text (if no win)
  if (winning_player === 0) {
    if (player === 2) {
      nf.innerHTML = 'Green turn';
    } else {
      nf.innerHTML = 'Remaining red turns: ' + Math.ceil(red_moves).toFixed(0);
    }
    // Notify the player whose turn it just became — but only when:
    //   (a) the active player actually changed (red→green or green→red), AND
    //   (b) this was NOT caused by an undo (s.undo_calls===1 means undo —
    //       the undoing player already knows it's their turn, and the other
    //       player should not be told it's now the undoing player's turn).
    if (player !== prev_player && s.undo_calls === 0 &&
        socket && my_seat !== null && my_seat === player) {
      var turnMsg = (player === 1)
        ? 'It is now your turn, Red. Remaining red turns: ' + Math.ceil(red_moves).toFixed(0)
        : 'It is now your turn, Green.';
      notifyTurn(turnMsg);
    }
  }
}

// ── Chat helpers ─────────────────────────────────────────────────────────────
var chatVisible = false;
function toggleChat() {
  chatVisible = !chatVisible;
  document.getElementById('chat_body').style.display = chatVisible ? 'flex' : 'none';
}
function appendChatMsg(who, msg) {
  var log = document.getElementById('chat_log');
  var line = document.createElement('div');
  line.style.cssText = 'padding:2px 0; border-bottom:1px solid #333;';
  var color = who === 'Red' ? '#f88' : (who === 'Green' ? '#8f8' : '#aaa');
  line.innerHTML = '<b style="color:' + color + '">' + who + ':</b> ' +
                   msg.replace(/</g, '&lt;').replace(/>/g, '&gt;');
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
  if (!chatVisible) toggleChat(); // auto-open when message arrives
}
function sendChat() {
  var input = document.getElementById('chat_input');
  var msg = input.value.trim();
  if (!msg || !socket) return;
  socket.emit('chat', { msg: msg });
  input.value = '';
}
function chatKeydown(ev) {
  if (ev.key === 'Enter') { ev.stopPropagation(); sendChat(); }
  ev.stopPropagation(); // prevent ALL keys in chat input reaching the game
}

// ── Initialise Socket.IO ─────────────────────────────────────────────────────
function initSocket() {
  socket = io();   // connects back to the server that served this page

  socket.on('welcome', function(data) {
    my_seat = data.seat;
    if (my_seat === 1)      updateSeatBanner('You are RED  (seat 1)');
    else if (my_seat === 2) updateSeatBanner('You are GREEN (seat 2)');
    else                    updateSeatBanner('Spectator');
    applyServerState(data.state);
  });

  socket.on('state_update', function(s) {
    applyServerState(s);
  });

  // The other client finished set_bond_colors after a move and sends the delta
  socket.on('cylinder_delta', function(cols) {
    var nc = 7 * 19 * actual_levels;
    for (var ii = 0; ii < nc; ++ii)
      cylinder_colors[ii] = cols[ii];
  });

  // win_declared: the OTHER client detected the win and told the server;
  // show the alert here too and set winning_player so Enter-key reset works.
  socket.on('win_declared', function(data) {
    if (winning_player > 0) return;  // we already detected it ourselves
    winning_player = data.winning_player;
    // setTimeout lets the browser activate this window before showing the alert,
    // so it appears immediately without requiring a mouse-enter event.
    setTimeout(function() {
      if (winning_player === 1) {
        ++green_wins;
        nf.innerHTML = "Green 1D player wins. Red wins " + red_wins + ", green wins " + green_wins +
                       ". Press Enter key to start over with current settings.";
        alert('Green 1D player wins. Press Enter key to start over with current settings.');
      mouse_down = 0; dragging = false;  // alert consumed the mouseup event
      refocusCanvas();
      } else {
        ++red_wins;
        nf.innerHTML = "Red 2D player wins. Red wins " + red_wins + ", green wins " + green_wins +
                       ". Press Enter key to start over with current settings.";
        alert('Red 2D player wins. Press Enter key to start over with current settings.');
      }
      mouse_down = 0; dragging = false;
    }, 0);
  });

  // undo_rejected: the server detected that another player moved first (race condition).
  // Roll back the optimistic local undo and alert the player.
  socket.on('undo_rejected', function(data) {
    // Re-apply the move that was optimistically undone: restore sphere color and bonds.
    sphere_colors[19*move_active_level + move_active_k] = 3 - player; // mover's color
    set_bond_colors(move_active_level, move_active_k, 3 - player, 0);
    undo_calls = 1;  // prevent further undo attempts
    mouse_down = 0; dragging = false;
    alert(data.message + '\nThe board has been restored.');
  });

  socket.on('chat', function(data) {
    appendChatMsg(data.who, data.msg);
  });

  // seat_change: server tells clients who won the red bid and who is now green.
  socket.on('seat_change', function(data) {
    my_seat = (my_seat === data.red_seat) ? 1 : 2;
    if (my_seat === 1) {
      updateSeatBanner('You are RED  (seat 1) — won red bid');
      nf.innerHTML = 'You won the red bid! You are now the Red player.';
    } else {
      updateSeatBanner('You are GREEN (seat 2)');
      nf.innerHTML = 'The other player claimed Red. You are the Green player.';
    }
  });

  socket.on('bid_rejected', function(data) {
    nf.innerHTML = data.message;
    alert(data.message);
    mouse_down = 0; dragging = false;
  });

  socket.on('player_list', function(seats) {
    var seated = seats.length;
    if (seated < 2)
      updateSeatBanner((my_seat ? 'You are seat ' + my_seat + '  ' : 'Spectator  ')
                       + '— waiting for second player');
    else if (my_seat === 1)
      updateSeatBanner('You are RED  (seat 1)');
    else if (my_seat === 2)
      updateSeatBanner('You are GREEN (seat 2)');
    else
      updateSeatBanner('Spectator');
  });
}

// Vertex shader program
var VSHADER_SOURCE_constant =
  'attribute vec4 a_Position_constant;\n' +
  'void main() {\n' +
  '  gl_Position = a_Position_constant;\n' +
  '}\n';

// Constant color fragment shader program
var FSHADER_SOURCE_constant =
  'precision mediump float;\n' +
  'uniform vec4 u_FragColor;\n' +
  'void main() {\n' +
  '  gl_FragColor = u_FragColor;\n' +
  '}\n';

var VSHADER_SOURCE_phong =
  'attribute vec4 a_Position;\n' +
  'attribute vec4 a_Normal;\n' +       // Normal
  'uniform vec3 u_v_Viewpoint;\n' +
  'uniform int u_two_sided_normal;\n' +
  'uniform mat4 u_MvpMatrix;\n' +
  'uniform mat4 u_ModelMatrix;\n' +   // Transformation matrix of vertices before perspective
  'uniform mat4 u_NormalMatrix;\n' +   // Transformation matrix of the normal
  'varying vec3 v_Normal;\n' +
  'varying vec3 v_Position;\n' +
  'void main() {\n' +
  '  gl_Position = u_MvpMatrix * a_Position;\n' +
  '  v_Position = vec3(u_ModelMatrix * a_Position);\n' +
     // Recalculate the normal based on the model matrix and make its length 1.
  '  v_Normal = normalize(vec3(u_NormalMatrix * a_Normal));\n' +
  '  if (u_two_sided_normal > 0)\n' +
  '    if (dot(u_v_Viewpoint - v_Position, v_Normal) < 0.)\n' +
  '       v_Normal = -v_Normal;\n' +
  '}\n';

// Fragment shader program
var FSHADER_SOURCE_phong =
  'precision mediump float;\n' +
  ///linear
  'uniform vec3 u_DiffuseLight;\n' +   // Diffuse light color
  'uniform vec3 u_LightDirection;\n' + // Diffuse light direction (in the world coordinate, normalized)
  'uniform vec3 u_AmbientLight;\n' +   // Color of an ambient light
  'uniform vec4 u_Color;\n' +       // Color
  'uniform vec3 u_Viewpoint;\n' +
  'uniform float u_PhongExponent;\n' +
  'uniform int u_compute_color;\n' +
  'varying vec3 v_Normal;\n' +
  'varying vec3 v_Position;\n' +
  'void main() {\n' +
  ' if(u_compute_color == 0)\n'+
  '  gl_FragColor = u_Color;\n' +
  ' else {\n' +
  '  vec3 normal = normalize(v_Normal);\n' +
  '  float nDotL = max(dot(u_LightDirection, normal), 0.0);\n' +
  // Calculate the color due to diffuse reflection
  '  vec3 diffuse = .5*nDotL*u_DiffuseLight*vec3(u_Color);\n' +
  // Calculate the color due to ambient reflection
  '  vec3 ambient = u_AmbientLight*vec3(u_Color);\n' +
  // Compute phong highlight;
  '  vec3 refl = 2.*nDotL*normal - u_LightDirection;\n' +
  '  vec3 view = normalize(u_Viewpoint - v_Position);\n' + 
  '  float phong_dot = max(dot(refl, view), 0.0);\n' +
  '  vec3 phong = .3*pow(phong_dot, u_PhongExponent)*u_DiffuseLight;\n' +
  // Add the surface colors due to diffuse, phong, and ambient reflection
  '  gl_FragColor = vec4(diffuse + ambient + phong, u_Color.a);\n' + 
  ' }\n' +
  '}\n';

function cross(a, b) {
   return [ a[1]*b[2] - a[2]*b[1], a[2]*b[0] - a[0]*b[2], a[0]*b[1] - a[1]*b[0] ];
   }
   
function initSites() {
  for (let i = 0; i < 19; ++i)
        for (let k = 0; k < 3; ++k)
           sites[k + 3*i] = saved_sites[k + 3*i]
  for (let j = 0; j < actual_levels; ++j)
     for (let i = 0; i < 19; ++i)
        for (let k = 0; k < 3; ++k)
           sites[k + 3*(i + 19*j)] = sites[k + 3*i] + j - (actual_levels-1)/4.;
  for (let i = 0; i < 19; ++i)
        for (let k = 0; k < 3; ++k)
           sites[k + 3*i] = sites[k + 3*i] - (actual_levels-1)/4.;
  }

const opositions = [];
const onormals = [];
const oindices = [];
  
function buildGeometry() {   // Code received from Claude, June 18, 2026
  // The 24 unique corner positions of the truncated octahedron solid.
  const corners = [];
  const base = [0, 1, 2];
  function permutations(arr) {
    if (arr.length <= 1) return [arr];
    const result = [];
    for (let i = 0; i < arr.length; i++) {
      const rest = arr.slice(0, i).concat(arr.slice(i + 1));
      for (const p of permutations(rest)) {
        result.push([arr[i]].concat(p));
      }
    }
    return result;
  }
  const seen = new Set();
  for (const perm of permutations(base)) {
    const signOptions = perm.map(v => (v === 0 ? [0] : [v, -v]));
    for (const sx of signOptions[0]) {
      for (const sy of signOptions[1]) {
        for (const sz of signOptions[2]) {
          const key = sx + ',' + sy + ',' + sz;
          if (!seen.has(key)) {
            seen.add(key);
            corners.push([sx, sy, sz]);
          }
        }
      }
    }
  }
  // corners.length === 24

  function findCorner(x, y, z) {
    for (let i = 0; i < corners.length; i++) {
      const c = corners[i];
      if (c[0] === x && c[1] === y && c[2] === z) return i;
    }
    throw new Error('corner not found: ' + x + ',' + y + ',' + z);
  }

  // Order a face's corner indices counter-clockwise as seen from
  // outside the solid (i.e. looking down -normal), via angle sort
  // around the face centroid in the face's own plane.
  function orderFace(indices, normal) {
    const pts = indices.map(i => corners[i]);
    const n = pts.length;
    const center = [0, 0, 0];
    for (const p of pts) { center[0] += p[0]; center[1] += p[1]; center[2] += p[2]; }
    center[0] /= n; center[1] /= n; center[2] /= n;

    function sub(a, b) { return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
    function cross(a, b) {
      return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
    }
    function dot(a, b) { return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
    function norm(a) { const l = Math.sqrt(dot(a,a)); return [a[0]/l, a[1]/l, a[2]/l]; }

    let u = norm(sub(pts[0], center));
    let v = norm(cross(normal, u));

    const angles = pts.map(p => {
      const d = sub(p, center);
      return Math.atan2(dot(d, v), dot(d, u));
    });
    const order = indices.map((_, k) => k).sort((a, b) => angles[a] - angles[b]);
    let ordered = order.map(k => indices[k]);

    // Ensure outward winding: (p1-p0) x (p2-p0) should align with normal
    const p0 = corners[ordered[0]], p1 = corners[ordered[1]], p2 = corners[ordered[2]];
    const cr = cross(sub(p1, p0), sub(p2, p0));
    if (dot(cr, normal) < 0) ordered = ordered.reverse();
    return ordered;
  }

  // Collect faces as { normal, cornerIndices(ordered) }
  const faces = [];

  // 6 squares: one coordinate is ±2
  for (let axis = 0; axis < 3; ++axis) {
    for (const sign of [2, -2]) {
      const normal = [0, 0, 0];
      normal[axis] = sign > 0 ? 1 : -1;
      const idx = [];
      for (let i = 0; i < corners.length; i++) {
        if (corners[i][axis] === sign) idx.push(i);
      }
      faces.push({ normal: normal, corners: orderFace(idx, normal) });
    }
  }

  // 8 hexagons: perpendicular to (±1,±1,±1), the 6 farthest vertices
  // in that direction (dot product maximal) form the hexagon.
  for (const sx of [1, -1]) {
    for (const sy of [1, -1]) {
      for (const sz of [1, -1]) {
        const dir = [sx, sy, sz];
        const dots = corners.map(c => c[0]*dir[0] + c[1]*dir[1] + c[2]*dir[2]);
        const mx = Math.max(...dots);
        const idx = [];
        for (let i = 0; i < corners.length; i++) {
          if (Math.abs(dots[i] - mx) < 1e-9) idx.push(i);
        }
        const len = Math.sqrt(dir[0]*dir[0] + dir[1]*dir[1] + dir[2]*dir[2]);
        const normal = [dir[0]/len, dir[1]/len, dir[2]/len];
        faces.push({ normal: normal, corners: orderFace(idx, normal) });
      }
    }
  }


  // Build the flat-shaded vertex/normal/index buffers. Each
  // face gets its own private set of vertices so its normal (and
  // color) is constant across the face -- this is what gives the
  // hard-edged "flat shaded" faceted look.

  let vbase = 0;
  for (const face of faces) {
    const n = face.normal;
    const isSquare = face.corners.length === 4;

    for (const ci of face.corners) {
      const c = corners[ci];
      opositions.push(c[0], c[1], c[2]);
      onormals.push(n[0], n[1], n[2]);

    }

    // Fan-triangulate the (already convex, ordered) polygon.
    const m = face.corners.length;
    for (let k = 1; k < m - 1; ++k) {
      oindices.push(vbase, vbase + k, vbase + k + 1);
    }
    vbase += m;
  }
console.log("opositions", opositions.length, "onormals", onormals.length,
    "oindices", oindices.length);
}

function depth_first_search(kind) {  // determine connectness from level 0 to level actual_levels-1
   var i, j, k, l, m, mm, n, temp_m, db_dfs = 0;
   var stack = []; // last in first out for depth first search
   if (db_dfs && kind)
   	console.log("Beginning DFS");
   var visited = new Int16Array(nsites).fill(0); // initialize to unvisited
   for (k = 0; k < 19; ++k) // push all acceptable cells on layer 0 onto stack
      if (sphere_colors[k] == 2 ||
            kind == 1 && sphere_colors[k] == 0) {  // green, or else unclaimed if kind == 1
         stack.push(k);
         if (db_dfs && kind)
            console.log(" Pushing level 0 k", k, "of color", sphere_colors[k], "onto stack");
         }
   while (stack.length > 0) {
      j = stack.pop();
      if (!visited[j]) {
         visited[j] = 1;
         if (db_dfs && kind)
            console.log("  visiting level", Math.floor(j/19.),"k",j-19*Math.floor(j/19.) );
         for (m = 0; m < 14; ++m) {
           mm = all_bonds_in_order[m];
           n = win_test_bond_sites[14*j + mm]; // do most forward bonds first
           if (n >= 0 && (sphere_colors[n] == 2 ||
               kind == 1 && sphere_colors[n] == 0)) {  // green, or else unclaimed if kind == 1
                 stack.push(n);
              if (Math.ceil((n+1)/19.) >= actual_levels) { // reached the last level
                 if (db_dfs && kind)
                   console.log(" Returning true at level", 
                      Math.floor(n/19.),"k",n-19*Math.floor(n/19.) );
                 return true;
                 }
              }
            }
         }  
      }
   return false; 
   }

function initVertexBuffers(gl) {
  // Create a sphere
   var i, j, k, l, m, n, lph, lth, lthph, theta, phi, debug = 0, dbb = 1;
   var centroid = [0, 0, 0];
   var ctheta = new Float32Array(ntheta);
   var stheta = new Float32Array(ntheta);
   var cphi = new Float32Array(nphi);
   var sphi = new Float32Array(nphi);
   var cyl_cphi = new Float32Array(nphi);
   var cyl_sphi = new Float32Array(nphi);

 // create octahedron geometry using program gotten from Claude on June 18, 2026
   buildGeometry();
 // copy octahedron geometry before spheres, cylinders, triangles, and lines
   for (i = 0; i < 3*72; ++i) {
      vertices[i] = .52*opositions[i];
      normals[i] = onormals[i];
      }
   for (i = 0; i < 3*44; ++i)
      indices[i] = oindices[i];
         
   // pre-compute sines and cosines
   for (i = 0; i < ntheta; ++i) {
      theta = i*Math.PI/(ntheta - 1);
      stheta[i] = Math.sin(theta);
      ctheta[i] = Math.cos(theta);
      }
   for (i = 0; i < nphi; ++i) {
      phi = i*2*Math.PI/(nphi - 1);
      sphi[i] = Math.sin(phi);
      cphi[i] = Math.cos(phi);
      }
   for (i = 0; i < ncyl_phi; ++i) {
      phi = i*2*Math.PI/(ncyl_phi - 1);
      cyl_sphi[i] = Math.sin(phi);
      cyl_cphi[i] = Math.cos(phi);
      }
   // compute vertices and normals to the unit sphere using spherical coordinates
   for (i = 0; i < ntheta; ++i) {
      for (j = 0; j < nphi; ++j) {
         k = 3*(72 + nphi*i + j);
         vertices[k  ] = stheta[i]*cphi[j];
         vertices[k+2] = stheta[i]*sphi[j];
         vertices[k+1] = ctheta[i];
         normals[k  ] = stheta[i]*cphi[j];
         normals[k+2] = stheta[i]*sphi[j];
         normals[k+1] = ctheta[i];
         }
      }
   for (i = 0; i < ntheta-1; ++i) { // triangles for sphere
      for (j = 0; j < nphi-1; ++j) {
         k = 3*44 + 6*((nphi-1)*i + j);
         l = 72 + nphi*i + j;
         lph = l + 1;
         lth = l + nphi;
         lthph = lth + 1;
         indices[k  ] = l;
         indices[k+1] = lph;
         indices[k+2] = lth;
         indices[k+3] = lth;
         indices[k+4] = lph;
         indices[k+5] = lthph;
         }
      }
   // compute vertices and normals to the unit cylinder using spherical coordinates
   for (j = 0; j < ncyl_phi; ++j) {
      k = 6*j + 3*(72 + sphere_vertices);
      vertices[k  ] = cyl_cphi[j];
      vertices[k+2] = cyl_sphi[j];
      vertices[k+1] = 0;
      normals[k  ] = cyl_cphi[j];
      normals[k+2] = cyl_sphi[j];
      normals[k+1] = 0;
      vertices[k+3] = cyl_cphi[j];
      vertices[k+5] = cyl_sphi[j];
      vertices[k+4] = 1.;
      normals[k+3] = cyl_cphi[j];
      normals[k+5] = cyl_sphi[j];
      normals[k+4] = 0;
      // console.log(k, vertices[k  ], vertices[k+1], vertices[k+2]);
      // console.log(k + 3, vertices[k+3], vertices[k+4], vertices[k+5]);
      }
   for (j = 0; j < ncyl_phi-1; ++j) {  // triangles for cylinder
      k = 6*j + 3*(44 + sphere_triangles);
      l = 72 + sphere_vertices + 2*j;
      lph = l + 1;
      lth = l + 2;
      lthph = lth + 1;
      indices[k  ] = l;
      indices[k+1] = lph;
      indices[k+2] = lth;
      indices[k+3] = lth;
      indices[k+4] = lph;
      indices[k+5] = lthph;
      }
      
   let tnormal = [], kk, dbg = 0, a = [], b = [], c = [], d = [],
      kistart = 0, otrianglefac = 1.-trianglefac;
   for (n = 0; n < 12; ++n) {  // for flat triangles
      i = triangles[n][0];
      j = triangles[n][1];
      k = 3*(tvstart + 3*n);
      vertices[k  ] = 0;
      vertices[k+1] = 0;
      vertices[k+2] = 0;
      for (l = 0; l < 3; ++l) {
         vertices[k + 3 + l] = bond_vector[3*i + l];
         vertices[k + 6 + l] = bond_vector[3*j + l];
         centroid[l] = (bond_vector[3*i + l] + bond_vector[3*j + l])/3.;
         }
      for (let kv = 3*(tvstart + 3*n); kv < 3*(tvstart + 3*n + 3); kv += 3)
       for (l = 0; l < 3; ++l) 
        vertices[kv + l] = trianglefac*vertices[kv + l] + otrianglefac*centroid[l];
      kk = tistart + 3*n;
      kistart = tvstart + 3*n;
      for (l = 0; l < 3; ++l) {
        indices[kk + l] = kistart + l;
        a[l] = bond_vector[3*i + l];
        b[l] = bond_vector[3*j + l];
        }
      tnormal = cross(a, b);
      for (l = 0; l < 3; ++l)
         for (m = 0; m < 3; ++m)
            normals[k + 3*l + m] = tnormal[m];
      if (dbg) {
          console.log("triangle", n, "k", k, "normal", tnormal[0], tnormal[1], tnormal[2]);
          console.log("  vertex 1:   ", vertices[k], vertices[k+1], vertices[k+2]);
          console.log("  vertex 2:   ", vertices[k+3], vertices[k+4], vertices[k+5]);
          console.log("  vertex 3:   ", vertices[k+6], vertices[k+7], vertices[k+8]);
          console.log("  kk", kk, "indices", indices[kk], indices[kk+1], indices[kk]+2);
          }
      }
      
      for (i = 0; i < nsites; ++i) 
         for (j = 0; j < 7; ++j) {
           m = 14*i + j;
           n =  7*i + j;
           mm = bond_sites[m];
           if (mm < 0) continue;
           k = listart + 2*n;
           l = 3*lvstart + 6*n;
           for (nn = 0; nn < 3; ++nn) {
             vertices[l + nn] = sites[3*i + nn];
             vertices[l + nn + 3] = sites[3*mm + nn];
             }
           indices[k] = lvstart + 2*n;
           indices[k+1] = lvstart + 2*n + 1;
           if (dbb && i < 20) {
              console.log("i", i, "j", j, "m", m, "n", n, "k", k, "l", l);
              let kk = indices[k], k1 = indices[k+1];
              console.log("   ", kk, vertices[3*kk], vertices[3*kk + 1], vertices[3*kk + 2]);
              console.log("   ", k1, vertices[3*k1], vertices[3*k1 + 1], vertices[3*k1 + 2]);
              }
           }
       // make the 7 forward bonds from the  central active site
       
        i = 19*active_level + active_k;
        for (jj = 0; jj < 7; ++jj) {
           j = forward_bonds[jj];
           mm = 14*i + j;
           n = bond_sites[mm];
           l = 3*fvstart + 6*jj;
           for (nn = 0; nn < 3; ++nn) {
             vertices[l + nn] = sites[3*i + nn];
             vertices[l + nn + 3] = sites[3*n + nn];
             }
           k = fistart + 2*jj;
           indices[k] = fvstart + 2*jj;
           indices[k+1] = fvstart + 2*jj + 1;
           console.log("i", i, "jj", jj, "l", l, "k", k, "fistart + 2*jj", fvstart + 2*jj);
           }
	// Write the vertex property to buffers (coordinates, colors and normals)
	if (!initArrayBuffer(gl, 'a_Position', vertices, 3)) return -1;
	if (!initArrayBuffer(gl, 'a_Normal', normals, 3)) return -1;

	// Unbind the buffer object
	gl.bindBuffer(gl.ARRAY_BUFFER, null);

	// Write the indices to the buffer object
	var indexBuffer = gl.createBuffer();
	if (!indexBuffer) {
  		console.log('Failed to create the buffer object');
   	return false;
 		}
	gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
	gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);

	if (debug) {
		console.log("Vertices");
		for (i = 0; i < nverts; ++i)
			console.log(i, "   ", vertices[3*i], vertices[3*i + 1], vertices[3*i + 2]);
		console.log("Triangles");
		for (i = 0; i < ntriangles; ++i)
			console.log(i, "   ", indices[3*i], indices[3*i + 1], indices[3*i + 2]);
		}
	return indices.length;
}

function undo() {
        if (socket) {
          // Apply locally for immediate feedback, then tell the server.
          // Send the current move count so the server can detect race conditions
          // (another player moved between when we saw the state and sent the undo).
          sphere_colors[19*move_active_level + move_active_k] = 0;
          restore_bond_colors(move_active_level, move_active_k);
          socket.emit('undo', { expected_moves: moves });
          socket.emit('cylinder_delta', Array.from(cylinder_colors));
        } else {
          // offline fallback
	  sphere_colors[19*move_active_level + move_active_k] = 0;
	  restore_bond_colors(move_active_level, move_active_k);
	  if(player == 1 && red_moves_incremented) {
	     player = 2;
	     nf.innerHTML = "Green turn";
	     }
	  else {
	     player = 1;
	     if (red_moves_incremented)
	        red_moves -= redturns;
	     red_moves = red_moves + 1;
	     nf.innerHTML = "Red turn. Remaining red turns: " +
                  Math.ceil(red_moves).toFixed(0);
             }
          undo_calls = 1;
          }
        }
        
function do_new_move() {
        // In multiplayer mode, send the move to the server.
        // The server validates it, updates the authoritative state, and
        // broadcasts state_update to both clients.
        // We also run set_bond_colors locally for immediate visual feedback
        // and send the resulting cylinder_colors as a delta.
        if (socket) {
          if (my_seat === null) {
            nf.innerHTML = "Spectators cannot make moves.";
            return false;
          }
          // Enforce turns: seat 1 = red (player 1), seat 2 = green (player 2)
          if (my_seat !== player) {
            alert("It is not your turn, please wait.");
            mouse_down = 0; dragging = false;
      refocusCanvas();
            return false;  // signal to caller not to set mouse_down = 1
          }
          // Optimistic local update (visual only — authoritative copy comes from server)
          new_move = 1;
          do_drawing_cylinder_output = 1;
          // If there was a tentative (cursor-hover) bond colour preview, clear it first
          if (tentative_move_pending) {
            restore_bond_colors(active_level, active_k);
            tentative_move_pending = false;
          }
          sphere_colors[19*active_level + active_k] = player;
          set_bond_colors(active_level, active_k, player, 0);
          my_move_in_flight = true;   // stop applyServerState clobbering cylinder_colors
          first_add = 4;
          // Tell the server
          socket.emit('move', { level: active_level, k: active_k });
          // Send the cylinder_colors delta so the other player sees bonds
          socket.emit('cylinder_delta', Array.from(cylinder_colors));
        } else {
          // Single-player / offline fallback (original logic)
	  move_active_level = active_level;
	  move_active_k = active_k;
          undo_calls = 0;
          new_move = 1;
          do_drawing_cylinder_output = 1;
          sphere_colors[19*active_level + active_k] = player;
          set_bond_colors(active_level, active_k, player, 0);
          if (player == 1) {
             red_moves = red_moves - 1;
             nf.innerHTML = "Remaining red turns: " +
                  Math.ceil(red_moves).toFixed(0);
             if (red_moves <= 0) {
                red_moves += redturns;
                red_moves_incremented = 1;
                nf.innerHTML = "Green turn";
                player = 2;
                }
             else
                red_moves_incremented = 0;
             }
          else {
             player = 1;
             nf.innerHTML = "Remaining red turns: " +
                  Math.ceil(red_moves).toFixed(0);
             }
          console.log("red_moves", red_moves);
          ++moves;
          first_add = 4;
          }
        }
        
function add_random_red_site() {
   let level = Math.floor(actual_levels*Math.random());
   let k = Math.floor(19*Math.random());
   while (sphere_colors[19*level + k] != 0) {
      level = Math.floor(actual_levels*Math.random());
      k = Math.floor(19*Math.random());
      }
   if (socket) {
     socket.emit('setup', { add_random: { level, k } });
   } else {
     sphere_colors[19*level + k] = 1;   // always red, regardless of whose turn it is
     set_bond_colors(level, k, 1, 0);
     ++random_sites;
     nf.innerHTML = random_sites+" random red positions have been added";
     }
   }

             nf.innerHTML = "game has already started so cylinder length cannot be changed";
       break;
    case 78: // 'n' decrement end_level
      // console.log("end_level", end_level);
      if (end_level > start_level + 1) {
        --end_level;

      break;
    case 34: // page down: decrease actual_levels, i. e., length of cylinder 
         console.log("key press", ev.keyCode);
         if (moves == 0) {
           if (actual_levels > 2) {
              var new_levels = actual_levels - 1;
              if (socket) {
                socket.emit('setup', { actual_levels: new_levels });

      break;
    case 219: // '['
      currentAngle[0] += .3;
      break;
    case 221: // ']'
      currentAngle[0] -= .3;
      break;
    case 222: // '"'
      bond_lines = 1 - bond_lines;
      break; 
    case 188: // ',' or '<'
      currentAngle[1] -= .3;
      break;
    case 190: // '.' or '>'
      currentAngle[1] += .3;
      break; 
    case 97: // numpad 1
    case 49: // '1'
      if (trianglefac > 0) {
        trianglefac -= .0625;
        initVertexBuffers(gl);
        }
      break;
    case 98: // numpad 2
    case 50: // '2'
      if (trianglefac < 1) {
        trianglefac += .0625;
        initVertexBuffers(gl);
        }
      break;
    case 99: // numpad 3
    case 51: // '3'
      if (socket) {
        socket.emit('setup', { redturns: redturns + .0625 });
      } else {
        redturns += .0625;
        red_moves = redturns;
        nf.innerHTML = "Average red placements per turn is " + redturns.toFixed(4);
        }
      break;
    case 100: // numpad 4
    case 52: // '4'
      if (redturns > 1) {
        if (socket) {
          socket.emit('setup', { redturns: redturns - .0625 });
        } else {
          redturns -= .0625;
          red_moves = redturns;
          nf.innerHTML = "Average red placements per turn is " + redturns.toFixed(4);
          }
        }
      break;
    case 101: // numpad 5
    case 53: // '5' increase line width
      if (line_width < 7.375) {
       line_width += 0.125;
       gl.lineWidth(line_width);
       console.log("line_width", line_width);
       }
      break;
    case 102: // numpad 6
    case 54: // '6' decrease line width
      if (line_width > .125) {   
        line_width -= 0.125;
        gl.lineWidth(line_width);
        console.log("line_width", line_width);
        }
      break;
    case 103: // numpad 7
    case 55: // '7' increase opacity
      if (opacity < 1) {
       opacity += 0.125;
       console.log("opacity", opacity);
       }
      break;
    case 104: // numpad 8
    case 56: // '8' decrease opacity
      if (opacity > .125) {   
        opacity -= 0.125;
        console.log("opacity", opacity);
        }
      break;
    case 105: // numpad 9
    case 57: // '9' toggle between spheres and octahedra
      draw_octahedron = 1 - draw_octahedron;
      break;
    case 96: // numpad 0
    case 48: // '0' toggle showing only small neighborhood of cursor sphere
      only_near_cursor = 1 - only_near_cursor;
      first_clip = 1;
      break;
    case 109: // numpad -
    case 189: // '-' or '_' toggle showing thin context around the small neighborhood
      context = 1 - context;
      break;
    case 107: // numpad +
    case 187: // '=' toggle showing active_layer with yellowed sites and bonds
      yellow = 1 - yellow;
      break;
    case 220: // '\' or '|' toggle display of context bond lines
      display_context_bonds = 1 - display_context_bonds;
      break;
    case 32: // space
      if (moves > 0) 
         nf.innerHTML = "Cannot add a random red position. The game has already started.";
      else
         add_random_red_site();
      break;
    }
}

function initArrayBuffer(gl, attribute, data, num) {
 // Create a buffer object
 var buffer = gl.createBuffer();
 if (!buffer) {
   console.log('Failed to create the buffer object');
   return false;
 }
 // Write date into the buffer object
 gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
 gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
 // Assign the buffer object to the attribute variable
 var a_attribute = gl.getAttribLocation(program_phong, attribute);
 if (a_attribute < 0) {
   console.log('Failed to get the storage location of ' + attribute);
   return false;
 }
 gl.vertexAttribPointer(a_attribute, num, gl.FLOAT, false, 0, 0);
 // Enable the assignment of the buffer object to the attribute variable
 gl.enableVertexAttribArray(a_attribute);

 return true;
}

Matrix4.prototype.my_multiplyArray3 = function(p) {
  var e = this.elements;
  result = [];

  result[0] = p[0] * e[0] + p[1] * e[4] + p[2] * e[ 8] + e[12];
  result[1] = p[0] * e[1] + p[1] * e[5] + p[2] * e[ 9] + e[13];
  result[2] = p[0] * e[2] + p[1] * e[6] + p[2] * e[10] + e[14];

  return result;
};

         if (k < 7) 
            gl.uniform4fv(u_Color, colors[0]);
         else
            gl.uniform4fv(u_Color, colors[13]);
         }
      t_modelMatrix.setTranslate(tx, ty, tz);
      t_modelMatrix.multiply(normalMatrix);
      t_modelMatrix.translate(sites[3*i], sites[3*i+1], sites[3*i+2]);
      t_modelMatrix.scale(rscale, rscale, rscale);
      gl.uniformMatrix4fv(u_ModelMatrix, false, t_modelMatrix.elements);
      g_MvpMatrix.set(viewProjMatrix);
      g_MvpMatrix.multiply(t_modelMatrix);
      gl.uniformMatrix4fv(u_MvpMatrix, false, g_MvpMatrix.elements);
      if (debug_matrix > 1 && k == 0 && frame == 1)
     // print_flat_matrix_4(g_MvpMatrix.elements, "sphere g_MvpMatrix");
  	print_flat_matrix_4(t_modelMatrix.elements, "sphere t_modelMatrix");
      if(draw_octahedron || octo)	  	   
   	gl.drawElements(gl.TRIANGLES, 3*44, gl.UNSIGNED_SHORT, 0);
      else
   	gl.drawElements(gl.TRIANGLES, 3*sphere_triangles, gl.UNSIGNED_SHORT, 3*44*2);
      }
    }  
  }

function draw_bond_lines(gl, viewProjMatrix, u_MvpMatrix, u_ModelMatrix, u_NormalMatrix, context_pass) {
  var i, m, n, kk, dbg = 1, first = 7;
  
  normalMatrix.setRotate(currentAngle[1], 0.0, 1.0, 0.0); // Rotation around y-axis
  normalMatrix.rotate(currentAngle[0], 1.0, 0.0, 0.0); // Rotation around x-axis
  if (do_tilt_z) 
     normalMatrix.rotate( -Math.atan2(1., Math.sqrt(2.))*180./Math.PI, 0., 0., 1.);
  if (do_tilt_y)   
     normalMatrix.rotate( 45., 0.0, 1.0, 0.0); // Rotation around y-axis
  v_modelMatrix.setTranslate(tx, ty, tz);
  v_modelMatrix.multiply(normalMatrix);
  gl.uniformMatrix4fv(u_ModelMatrix, false, v_modelMatrix.elements);
  g_MvpMatrix.set(viewProjMatrix);
  g_MvpMatrix.multiply(v_modelMatrix);
  gl.uniformMatrix4fv(u_MvpMatrix, false, g_MvpMatrix.elements);
  if (context_pass)
    gl.lineWidth(1);
  else
    gl.lineWidth(line_width);
  for (j = jstart; j < jend; j += 1) {
   for (var l = start_level; l < end_level; ++l) {
     for (var k = 0; k < n_k; ++k)
       {
       i = 19*l + k;
       mm = 14*i + j;
       n = bond_sites[mm];
       if (n >= 0) {
         nl = Math.floor(n/19);
         nk = n - 19*nl;
         m = 7*i + j;
         kk = listart + 2*m;
         if (cylinder_colors[m] == 0 && suppress_white_bonds)
            continue;
         if (only_near_cursor && near[t_active_k].includes(k) && near[t_active_k].includes(nk) 
              && Math.abs(l  - t_active_level) <= near_level 
              && Math.abs(nl  - t_active_level) <= near_level || context_pass) { 
           if (j == t_active_level && nl == t_active_level && yellow)
              c_add = 4;
           else
              c_add = 0;
           gl.uniform4fv(u_Color, colors[cylinder_colors[m] + c_add]);
   	   gl.drawElements(gl.LINES, 2, gl.UNSIGNED_SHORT, 2*kk);
   	   }
   	 if (dbg && first && frame == 1) {
   	   --first;
   	   console.log("bond_lines j", j, "i", i, "k", k, "mm", mm, "m", m, "n", n, "kk", kk);
   	   }
   	 }
        }
      }
     }
   first_clip = 0;
   }
   
function draw_forward_bond_lines(gl, viewProjMatrix, u_MvpMatrix, u_ModelMatrix, u_NormalMatrix, context_pass) {
  var i, m, n, kk;
  normalMatrix.setRotate(currentAngle[1], 0.0, 1.0, 0.0); // Rotation around y-axis
  normalMatrix.rotate(currentAngle[0], 1.0, 0.0, 0.0); // Rotation around x-axis
  if (do_tilt_z) 
     normalMatrix.rotate( -Math.atan2(1., Math.sqrt(2.))*180./Math.PI, 0., 0., 1.);
  if (do_tilt_y)   
     normalMatrix.rotate( 45., 0.0, 1.0, 0.0); // Rotation around y-axis
  v_modelMatrix.setTranslate(tx, ty, tz);
  v_modelMatrix.multiply(normalMatrix);
  gl.uniformMatrix4fv(u_ModelMatrix, false, v_modelMatrix.elements);
  g_MvpMatrix.set(viewProjMatrix);
  g_MvpMatrix.multiply(v_modelMatrix);
  gl.uniformMatrix4fv(u_MvpMatrix, false, g_MvpMatrix.elements);
  gl.uniform4f(u_Color, 1, 0, 1, 1);
  gl.drawElements(gl.LINES, 2*7, gl.UNSIGNED_SHORT, 2*fistart);
  }
   
function drawcylinders(gl, viewProjMatrix, u_MvpMatrix, u_ModelMatrix, u_NormalMatrix) {
  var i, m, n, kk, c_add;
  if (db_cylinder_calls)
  	console.log("drawcylinders");
  normalMatrix.setRotate(currentAngle[1], 0.0, 1.0, 0.0); // Rotation around y-axis
  normalMatrix.rotate(currentAngle[0], 1.0, 0.0, 0.0); // Rotation around x-axis
  if (do_tilt_z) 
     normalMatrix.rotate( -Math.atan2(1., Math.sqrt(2.))*180./Math.PI, 0., 0., 1.);
  if (do_tilt_y)   
     normalMatrix.rotate( 45., 0.0, 1.0, 0.0); // Rotation around y-axis
  unrotated_normalMatrix.setRotate(
  	-Math.atan2(1., Math.sqrt(2.))*180./Math.PI, 0., 0., 1.);
  unrotated_normalMatrix.rotate( 45., 0.0, 1.0, 0.0); // Rotation around y-axis
  gl.uniform4f(u_Color, 1.0, 0.9, 0.8, 1.0);
  // gl.uniformMatrix4fv(u_NormalMatrix, false, normalMatrix.elements);
  gl.uniform4f(u_Color, 0.3, 1.0, 0.9, 1.0);
  for (j = jstart; j < jend; j += 1) { // calculate the rotation and scale;
    s_normalMatrix.setRotate(zrot[j], 0., 0., 1.);
    let ry = yrot[j];
    if (ry != 0.) 
      s_normalMatrix.rotate(ry, 0., 1., 0.);
    s_normalMatrix.rotate(xrot[j], 1., 0., 0.);
    t_normalMatrix.set(normalMatrix);
    t_normalMatrix.multiply(s_normalMatrix);
    gl.uniformMatrix4fv(u_NormalMatrix, false, t_normalMatrix.elements);
    // gl.uniform4f(u_Color, 0.2*j, .3+.1*j, -.4 +.2*j, 1.);
    // for (i = 0; i < actual_nsites)
    for (var l = start_level; l < end_level; ++l) {

     if (!only_near_cursor || Math.abs(l - t_active_level) <= near_level) { 
      for (var k = 0; k < n_k; ++k)
       {
       i = 19*l + k;
       mm = 14*i + j;
       n = bond_sites[mm];
       if (n >= 0) {
         m = 7*i + j;
         if (cylinder_colors[m] == 0 && suppress_white_bonds)
            continue;
         nl = Math.floor(n/19);
         nk = n - 19*nl;
         if (only_near_cursor && !(near[t_active_k].includes(k) && near[t_active_k].includes(nk) 
              && Math.abs(nl - t_active_level) <= near_level) )
            continue;
         if (l == t_active_level && nl == t_active_level && yellow)
            c_add = 4;
         else
            c_add = 0;
         gl.uniform4fv(u_Color, colors[cylinder_colors[m] + c_add]);
         if (0 && cylinder_colors[m] > 0 && do_drawing_cylinder_output)
           console.log("drawing cylinder", m, "i", i, "j", j, "bondsite", n, "color", cylinder_colors[m]);
         v_modelMatrix.setTranslate(tx, ty, tz);
         v_modelMatrix.multiply(normalMatrix);
  	 v_modelMatrix.translate(sites[3*i], sites[3*i+1], sites[3*i+2]);
  	 v_modelMatrix.multiply(s_normalMatrix);
  	 v_modelMatrix.scale(r_cyl, yscale[j], r_cyl); 
  	 gl.uniformMatrix4fv(u_ModelMatrix, false, v_modelMatrix.elements);
  	 g_MvpMatrix.set(viewProjMatrix);
  	 g_MvpMatrix.multiply(v_modelMatrix);
  	 v_modelMatrix.set(unrotated_normalMatrix);
  	 v_modelMatrix.translate(sites[3*i], sites[3*i+1], sites[3*i+2]);
  	 v_modelMatrix.multiply(s_normalMatrix);
  	 v_modelMatrix.scale(1, yscale[j], 1); 

  	 gl.uniformMatrix4fv(u_MvpMatrix, false, g_MvpMatrix.elements);
  	 if (debug_matrix > 1 && j == 6 && l == 1 && k == 0 && frame == 1) {
  	     v_modelMatrix.scale(1, 1./yscale[j], 1);
  	     // print_flat_matrix_4(g_MvpMatrix.elements, "cylinder g_MvpMatrix");
  	     print_flat_matrix_4(v_modelMatrix.elements, "cylinder v_modelMatrix");
  	     }
   	 gl.drawElements(gl.TRIANGLES, (ncyl_phi-1)*6, gl.UNSIGNED_SHORT,
   	     (44 + sphere_triangles) * 6);
   	 }
   	}
       }
      }
     }
   first_clip = 0;
   }
      
function drawtriangles(gl, viewProjMatrix, u_MvpMatrix, u_ModelMatrix, u_NormalMatrix, context_pass) {
  var i, k, l, m, n, ii, mm, nn, sm, sn, c_add, dbg = 0;
  
  normalMatrix.setRotate(currentAngle[1], 0.0, 1.0, 0.0); // Rotation around y-axis
  normalMatrix.rotate(currentAngle[0], 1.0, 0.0, 0.0); // Rotation around x-axis
  if (do_tilt_z) 
     normalMatrix.rotate( -Math.atan2(1., Math.sqrt(2.))*180./Math.PI, 0., 0., 1.);
  if (do_tilt_y)
     normalMatrix.rotate( 45., 0.0, 1.0, 0.0); // Rotation around y-axis
  gl.uniformMatrix4fv(u_NormalMatrix, false, normalMatrix.elements);
  for (l = start_level; l < end_level; ++l) {
      for (k = 0; k < n_k; ++k)  
        {
        i = 19*l + k;
        v_modelMatrix.setTranslate(tx, ty, tz);
        v_modelMatrix.multiply(normalMatrix);
  	v_modelMatrix.translate(sites[3*i], sites[3*i+1], sites[3*i+2]);
  	gl.uniformMatrix4fv(u_ModelMatrix, false, v_modelMatrix.elements);
  	g_MvpMatrix.set(viewProjMatrix);
  	g_MvpMatrix.multiply(v_modelMatrix);
  	if (true)
  	   {
  	   gl.uniformMatrix4fv(u_MvpMatrix, false, g_MvpMatrix.elements);
  	   if (debug_matrix > 1 && l == 1 && k == 0 && frame == 1) {
  	      let vv_modelMatrix = new Matrix4;
  	      vv_modelMatrix.setTranslate(sites[3*i], sites[3*i+1], sites[3*i+2]);
  	      print_flat_matrix_4(normalMatrix.elements, "triangle normalMatrix");
  	      print_flat_matrix_4(v_modelMatrix.elements, "triangle v_modelMatrix");
  	      }    
  	   // print_flat_matrix_4(g_MvpMatrix.elements, "triangle g_MvpMatrix");
   	   // gl.drawElements(gl.TRIANGLES, 36, gl.UNSIGNED_SHORT, 2*tistart); // 2 bytes per index
   	   // gl.drawElements(gl.TRIANGLES, 36, gl.UNSIGNED_SHORT, 0); // 2 bytes per index
   	   if (0 && frame == 1)
   	      for (ii = 0; ii < 7; ++ii) {
   	         m = bond_sites[14*i + ii];
   	         console.log("site", sites[3*m], sites[3*m+1], sites[3*m+2], 
   	            "vector", sites[3*i] + bond_vector[3*ii], 
   	            sites[3*i+1] + bond_vector[3*ii+1], sites[3*i+2] + bond_vector[3*ii+2]);
   	         }
   	   for (ii = 0; ii < 12; ++ii) {
   	      m = triangles[ii][0];
   	      n = triangles[ii][1];
   	      mm = bond_sites[14*i + m];
   	      nn = bond_sites[14*i + n];

   	      if (mm >= 0 && nn >= 0) {
   	        if( (sphere_colors[i]  == 1 ||  (player == 1 &&  i == active_i) ) &&
   	            (sphere_colors[mm] == 1 ||  (player == 1 && mm == active_i) ) &&
   	            (sphere_colors[nn] == 1 ||  (player == 1 && nn == active_i) ) ) {
   	          ml = Math.floor(mm/19);
   	          mk = mm - 19*ml;
   	          nl = Math.floor(nn/19);
   	          nk = nn - 19*nl;
   	          if (only_near_cursor) {
   	            if ( !( near[t_active_k].includes(k) && near[t_active_k].includes(mk)
   	              && near[t_active_k].includes(nk)
                      && Math.abs(l  - t_active_level) <= near_level 
                      && Math.abs(ml  - t_active_level) <= near_level
                      && Math.abs(nl  - t_active_level) <= near_level
                       !== context_pass) )
                       continue;
                    }
                  if (l == t_active_level && ml == t_active_level && nl == t_active_level && yellow)
                     c_add = 4;
                  else
                     c_add = 0;
                  gl.uniform4f(u_Color, colors[1 + c_add][0], colors[1 + c_add][1],
                             colors[1 + c_add][2], opacity);
   	          gl.drawElements(gl.TRIANGLES, 3, gl.UNSIGNED_SHORT, 2*tistart + 6*ii);
   	          if (dbg)
   	             console.log("first_add", first_add);
   	          if (dbg && first_add) {
   	             console.log("drew triangle", ii);
   	             console.log("vertices", i, mm, nn);
   	             let kk = 3*(tvstart + 3*ii);
   	             console.log("normal", normals[kk], normals[kk+1], normals[kk+2]);
   	             let vp = [vpx, vpy, vpz];
                     let v_P = [], vvp = [], vvn, vdot = [], a = [], b = [], c = [], d = [];
                     v_P[0] = new Vector4([sites[3*i],   sites[3*i  + 1], sites[3*i  + 2], 1.]);
                     v_P[1] = new Vector4([sites[3*mm],  sites[3*mm + 1], sites[3*mm + 2], 1.]);         
                     v_P[2] = new Vector4([sites[3*nn],  sites[3*nn + 1], sites[3*nn + 2], 1.]);
                     let v_N = new Vector3([normals[kk], normals[kk + 1], normals[kk + 2]]);
                     vvn = t_normalMatrix.multiplyVector3(v_N);
                     for (let p = 0; p < 3; ++p) {
                        vdot[p] = 0.;
                        vvp[p] = v_modelMatrix.multiplyVector4(v_P[p]);
                        for (let l = 0; l < 3; ++l)
                           vdot[p] += v_N.elements[l]*(vp[l] - vvp[p].elements[l]);
                        }
                     console.log("vdot", vdot[0], vdot[1], vdot[2]);
                     for (l = 0; l < 3; ++l) {
                        a[l] = v_P[1].elements[l] - v_P[0].elements[l];
                        b[l] = v_P[2].elements[l] - v_P[0].elements[l];
                        c[l] = vvp[1].elements[l] - vvp[0].elements[l];
                        d[l] = vvp[2].elements[l] - vvp[0].elements[l];                        
                        } 
                     let cr = cross(a, b);
                     console.log("cr", cr[0], cr[1], cr[2]);
                     let crr = cross(c, d);
                     console.log("c", c[0], c[1], c[2]);
                     console.log("d", d[0], d[1], d[2]);
                     console.log("crr", crr[0], crr[1], crr[2]);
                     console.log("vvn", vvn.elements[0], vvn.elements[1], vvn.elements[2]);
                     }
                   }
   	      // else 
   	      if (0 && frame == 1)
   	        console.log("negative site: l", l, "k", k, "i", i, "ii", ii, 
   	          "m", m, "mm", mm, "n", n, "nn", nn);
   	      }
   	   } 
   	}
      }
    }
  if (dbg && first_add)
    console.log("l", l, "k", k, "i", i, "ii", ii);
  }

function draw(gl, viewProjMatrix, u_MvpMatrix, u_ModelMatrix, u_NormalMatrix, kind) {
  var forward_lines = 0;
  // Clear color and depth buffer
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  if (debug_matrix > 0 && frame == 1)
  	print_flat_matrix_4(viewProjMatrix.elements, " draw viewProjMatrix");
  ++frame;

  gl.uniform1i(u_compute_color, 1);
  gl.depthMask(true);
  gl.enable(gl.CULL_FACE);
  gl.uniform1i(u_two_sided_normal, 0);
  drawspheres(gl, viewProjMatrix, u_MvpMatrix, u_ModelMatrix, u_NormalMatrix, kind);
  if (forward_lines) {
    gl.lineWidth(line_width);
    gl.uniform1i(u_compute_color, 0);
    draw_forward_bond_lines(gl, viewProjMatrix, u_MvpMatrix, u_ModelMatrix, u_NormalMatrix, 1);
    gl.uniform1i(u_compute_color, 1);
    }
  else if (bond_lines) {
    gl.lineWidth(line_width);
    gl.uniform1i(u_compute_color, 0);
    draw_bond_lines(gl, viewProjMatrix, u_MvpMatrix, u_ModelMatrix, u_NormalMatrix, 1);
    gl.uniform1i(u_compute_color, 1);
    }
  else
    drawcylinders(gl, viewProjMatrix, u_MvpMatrix, u_ModelMatrix, u_NormalMatrix);
  if (context && only_near_cursor && display_context_bonds) {
      gl.uniform1i(u_compute_color, 0);
      draw_bond_lines(gl, viewProjMatrix, u_MvpMatrix, u_ModelMatrix, u_NormalMatrix, 1);
      gl.uniform1i(u_compute_color, 1);
      }
  gl.disable(gl.CULL_FACE);
  gl.disable(gl.BLEND);
  gl.uniform1i(u_two_sided_normal, 1);
  if (opacity < 1) {
     gl.uniform1i(u_compute_color, 0);
     gl.enable(gl.BLEND);
     gl.depthMask(false);
     gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
     } 
  drawtriangles(gl, viewProjMatrix, u_MvpMatrix, u_ModelMatrix, u_NormalMatrix, 1);
  gl.uniform1i(u_two_sided_normal, 0);
  do_drawing_cylinder_output = 0;
  if (first_add > 0) 
    --first_add;
}

window.addEventListener('resize', function() {
  if (!canvas || !gl) return;
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight - text_line_height;
  gl.viewport(0, 0, canvas.width, canvas.height);
  // Recompute mvpMatrix so the next picking draw call uses the right projection.
  // mvpMatrix is the outer variable that onmousedown closes over.
  if (typeof mvpMatrix !== 'undefined' && typeof fov !== 'undefined') {
    mvpMatrix = new Matrix4();
    mvpMatrix.setPerspective(fov, canvas.width / canvas.height, 1, 100);
    mvpMatrix.lookAt(vpx, vpy, vpz, lookx, looky, lookz, 0, 1, 0);
    gl.uniformMatrix4fv(u_MvpMatrix, false, mvpMatrix.elements);
  }
});
